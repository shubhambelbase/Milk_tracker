<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Milk Tracker Pro</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --text-color: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --accent: #00d2ff;
            --success: #00ff9d;
            --danger: #ff4b4b;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Background Blob */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            animation: float 20s infinite ease-in-out;
            top: -100px;
            left: -100px;
        }
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(100px, 50px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Main Container */
        .app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 420px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Header */
        header { margin-bottom: 20px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-controls { display: flex; align-items: center; gap: 8px; }
        h1 { font-size: 1.2rem; font-weight: 700; flex-grow: 1; text-align: center; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }

        /* Month Scrubber */
        .month-scrubber-container { width: 100%; padding: 0 4px; opacity: 0.8; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .month-scrubber-label { font-size: 0.7rem; color: var(--text-muted); width: 30px; text-align: center; }

        /* Stats Strip */
        .stats { display: flex; gap: 8px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: rgba(0, 0, 0, 0.15); padding: 10px 4px; border-radius: 14px; text-align: center; }
        .stat-val { font-size: 1rem; font-weight: 700; display: block; margin-bottom: 2px; }
        .stat-val.money { color: var(--success); }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }

        /* --- Payment Dashboard (Global Ledger) --- */
        .payment-dashboard {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.25); /* Darker to stand out */
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }

        .ledger-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
        }
        .balance-amount.negative { color: var(--danger); } /* You Owe */
        .balance-amount.positive { color: var(--success); } /* Overpaid */

        .btn-add-payment {
            background: var(--success);
            color: #064e3b;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .payment-list-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .payment-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .payment-date { color: var(--text-muted); font-size: 0.75rem; }
        .payment-amt { font-weight: 600; color: var(--success); }
        .payment-delete {
            background: none; border: none; color: var(--danger); opacity: 0.5; cursor: pointer; padding: 4px;
        }

        /* Calendar Grid */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-label { text-align: center; font-size: 0.75rem; color: var(--text-muted); padding-bottom: 8px; font-weight: 600; }
        .day-cell {
            aspect-ratio: 1; background: rgba(255, 255, 255, 0.05); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 0.9rem; font-weight: 500;
        }
        .day-cell.today { border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.1); }
        .day-cell.received { background: var(--accent); color: #1a202c; box-shadow: 0 4px 12px rgba(0, 210, 255, 0.4); }
        .day-cell.empty { background: transparent; cursor: default; }

        /* Modals */
        .modal-overlay {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100; border-radius: 24px;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: rgba(30, 30, 40, 0.95); width: 100%; padding: 24px; border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-overlay.open .modal-card { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.25rem; font-weight: 600; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

        /* Inputs */
        .form-group { margin-bottom: 16px; }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px; border-radius: 12px; color: white; font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        
        /* Sliders & Switches */
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 5px; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255, 255, 255, 0.2); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

        /* Buttons */
        .btn-primary { width: 100%; padding: 16px; background: var(--accent); color: #1a202c; border: none; border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn-danger { width: 100%; padding: 16px; background: rgba(255, 75, 75, 0.15); color: #ff4b4b; border: 1px solid rgba(255, 75, 75, 0.3); border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 12px; }

        /* Quantity Control */
        .qty-control-wrapper { background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 16px; margin-bottom: 16px; }
        .qty-display-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .qty-value { font-size: 1.5rem; font-weight: 700; color: white; }
        .qty-controls { display: flex; align-items: center; gap: 12px; }
        .stepper-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        svg { pointer-events: none; fill: currentColor; }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="header-controls">
                    <button class="icon-btn" id="prevBtn"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
                    <button class="icon-btn" id="nextBtn"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
                </div>
                <h1 id="monthDisplay">Month</h1>
                <button class="icon-btn" id="settingsBtn"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
            </div>
            
            <div class="month-scrubber-container">
                <span class="month-scrubber-label">Jan</span>
                <input type="range" id="monthSlider" min="0" max="11" step="1">
                <span class="month-scrubber-label">Dec</span>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-val" id="daysCount">0</span>
                <span class="stat-label">Mo. Days</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="totalQty">0</span>
                <span class="stat-label">Mo. Liters</span>
            </div>
            <div class="stat-card">
                <span class="stat-val money" id="totalAmt">0</span>
                <span class="stat-label">Mo. Cost</span>
            </div>
        </div>

        <div class="payment-dashboard">
            <div class="payment-header">
                <div>
                    <div class="ledger-title">Total Outstanding</div>
                    <div id="globalBalanceAmt" class="balance-amount">0</div>
                </div>
                <button class="btn-add-payment" id="openPayModalBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Payment
                </button>
            </div>
            
            <div class="payment-list-title">Recent Transactions</div>
            <div class="payment-list" id="paymentHistoryList">
                </div>
        </div>

        <div class="calendar-grid">
            <div class="day-label">Su</div>
            <div class="day-label">Mo</div>
            <div class="day-label">Tu</div>
            <div class="day-label">We</div>
            <div class="day-label">Th</div>
            <div class="day-label">Fr</div>
            <div class="day-label">Sa</div>
            <div id="calendarDays" style="display: contents;"></div>
        </div>

        <div class="modal-overlay" id="entryModal">
            <div class="modal-card">
                <div class="modal-header">
                    <span class="modal-title" id="selectedDateText">Date</span>
                    <button class="close-btn action-close">&times;</button>
                </div>
                <div class="toggle-row">
                    <span>Received</span>
                    <label class="switch"><input type="checkbox" id="milkToggle"><span class="slider"></span></label>
                </div>
                <div class="qty-control-wrapper">
                    <div class="qty-display-row">
                        <span class="qty-value"><span id="qtyDisplay">0</span> L</span>
                        <span class="cost-preview" style="color:var(--success); font-weight:600;" id="dailyCostDisplay">0</span>
                    </div>
                    <div class="qty-controls">
                        <button class="stepper-btn" id="decrQty">-</button>
                        <input type="range" id="qtySlider" min="0" max="5" step="0.5" value="0">
                        <button class="stepper-btn" id="incrQty">+</button>
                    </div>
                </div>
                <div class="form-group"><label>Note</label><input type="text" id="milkNote" placeholder="e.g. Extra milk..."></div>
                <button class="btn-primary" id="saveEntryBtn">Save Entry</button>
            </div>
        </div>

        <div class="modal-overlay" id="paymentModal">
            <div class="modal-card">
                <div class="modal-header">
                    <span class="modal-title">Record Payment</span>
                    <button class="close-btn action-close">&times;</button>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="payAmountInput" placeholder="Amount (e.g. 2000)">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="payDateInput">
                </div>
                <button class="btn-primary" id="savePaymentBtn">Save Payment</button>
            </div>
        </div>

        <div class="modal-overlay" id="settingsModal">
            <div class="modal-card">
                <div class="modal-header">
                    <span class="modal-title">Settings</span>
                    <button class="close-btn action-close">&times;</button>
                </div>
                <div class="form-group">
                    <label>Price Per Liter</label>
                    <input type="number" id="priceInput" placeholder="Enter price" step="0.01">
                </div>
                <button class="btn-primary" id="saveSettingsBtn">Save Settings</button>
                <button class="btn-danger" id="clearAllBtn">Clear All History</button>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let nav = 0; 
        let clicked = null; 
        let events = localStorage.getItem('milkEvents') ? JSON.parse(localStorage.getItem('milkEvents')) : {};
        let payments = localStorage.getItem('milkPaymentLog') ? JSON.parse(localStorage.getItem('milkPaymentLog')) : [];
        let pricePerLiter = localStorage.getItem('milkPrice') ? parseFloat(localStorage.getItem('milkPrice')) : 90;
        
        // --- DOM ---
        const calendar = document.getElementById('calendarDays');
        const monthDisplay = document.getElementById('monthDisplay');
        const monthSlider = document.getElementById('monthSlider');
        
        // Stats
        const daysCountEl = document.getElementById('daysCount');
        const totalQtyEl = document.getElementById('totalQty');
        const totalAmtEl = document.getElementById('totalAmt');
        
        // Payment DOM
        const globalBalanceAmtEl = document.getElementById('globalBalanceAmt');
        const paymentHistoryList = document.getElementById('paymentHistoryList');
        const openPayModalBtn = document.getElementById('openPayModalBtn');
        const payAmountInput = document.getElementById('payAmountInput');
        const payDateInput = document.getElementById('payDateInput');
        const savePaymentBtn = document.getElementById('savePaymentBtn');

        // Modals
        const entryModal = document.getElementById('entryModal');
        const paymentModal = document.getElementById('paymentModal');
        const settingsModal = document.getElementById('settingsModal');
        const closeButtons = document.querySelectorAll('.action-close');
        
        // Milk Entry
        const milkToggle = document.getElementById('milkToggle');
        const qtySlider = document.getElementById('qtySlider');
        const qtyDisplay = document.getElementById('qtyDisplay');
        const dailyCostDisplay = document.getElementById('dailyCostDisplay');
        const milkNote = document.getElementById('milkNote');
        const saveEntryBtn = document.getElementById('saveEntryBtn');
        const incrQtyBtn = document.getElementById('incrQty');
        const decrQtyBtn = document.getElementById('decrQty');
        
        // Settings
        const settingsBtn = document.getElementById('settingsBtn');
        const priceInput = document.getElementById('priceInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        function init() {
            // Nav listeners
            document.getElementById('nextBtn').addEventListener('click', () => { nav++; load(); });
            document.getElementById('prevBtn').addEventListener('click', () => { nav--; load(); });
            monthSlider.addEventListener('input', (e) => {
                nav = parseInt(e.target.value) - new Date().getMonth(); 
                load(); 
            });

            // Modals
            closeButtons.forEach(btn => btn.addEventListener('click', closeModal));
            
            // Milk Logic
            saveEntryBtn.addEventListener('click', saveEntry);
            qtySlider.addEventListener('input', updateCostPreview);
            incrQtyBtn.addEventListener('click', () => {
                if(parseFloat(qtySlider.value) < 5) { qtySlider.value = parseFloat(qtySlider.value) + 0.5; updateCostPreview(); }
            });
            decrQtyBtn.addEventListener('click', () => {
                if(parseFloat(qtySlider.value) > 0) { qtySlider.value = parseFloat(qtySlider.value) - 0.5; updateCostPreview(); }
            });
            milkToggle.addEventListener('change', () => {
                if(milkToggle.checked && parseFloat(qtySlider.value) === 0) qtySlider.value = 1;
                else if (!milkToggle.checked) qtySlider.value = 0;
                updateCostPreview();
            });

            // Settings Logic
            settingsBtn.addEventListener('click', () => { priceInput.value = pricePerLiter; settingsModal.classList.add('open'); });
            saveSettingsBtn.addEventListener('click', () => {
                pricePerLiter = parseFloat(priceInput.value) || 0;
                localStorage.setItem('milkPrice', pricePerLiter);
                closeModal();
                load();
            });
            clearAllBtn.addEventListener('click', () => {
                if(confirm("Delete ALL data?")) {
                    localStorage.clear();
                    location.reload();
                }
            });

            // Payment Logic
            openPayModalBtn.addEventListener('click', () => {
                payAmountInput.value = '';
                const today = new Date().toISOString().split('T')[0];
                payDateInput.value = today;
                paymentModal.classList.add('open');
            });
            savePaymentBtn.addEventListener('click', savePayment);

            load();
        }

        function updateCostPreview() {
            const qty = parseFloat(qtySlider.value);
            qtyDisplay.innerText = qty;
            dailyCostDisplay.innerText = (qty * pricePerLiter).toFixed(0);
            if(qty > 0) milkToggle.checked = true;
        }

        function load() {
            const dt = new Date();
            if (nav !== 0) dt.setMonth(new Date().getMonth() + nav);

            const month = dt.getMonth();
            const year = dt.getFullYear();
            const firstDayOfMonth = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const paddingDays = firstDayOfMonth.getDay();
            
            monthDisplay.innerText = `${dt.toLocaleDateString('en-us', { month: 'long' })} ${year}`;
            monthSlider.value = month;

            calendar.innerHTML = '';
            
            let monthlyDays = 0;
            let monthlyQty = 0;

            // Render Calendar
            for(let i = 1; i <= paddingDays + daysInMonth; i++) {
                const daySquare = document.createElement('div');
                daySquare.classList.add('day-cell');
                
                if (i > paddingDays) {
                    const dayNum = i - paddingDays;
                    const dateKey = `${month + 1}/${dayNum}/${year}`;
                    daySquare.innerText = dayNum;

                    if (events[dateKey]) {
                        if (events[dateKey].qty > 0) {
                            daySquare.classList.add('received');
                            monthlyDays++;
                            monthlyQty += parseFloat(events[dateKey].qty);
                        }
                    }
                    const todayObj = new Date();
                    if (dayNum === todayObj.getDate() && month === todayObj.getMonth() && year === todayObj.getFullYear()) {
                        daySquare.classList.add('today');
                    }
                    daySquare.addEventListener('click', () => openEntryModal(dateKey));
                } else {
                    daySquare.classList.add('empty');
                }
                calendar.appendChild(daySquare);
            }

            // Monthly Stats (Top Bar)
            daysCountEl.innerText = monthlyDays;
            totalQtyEl.innerText = monthlyQty.toFixed(1);
            totalAmtEl.innerText = (monthlyQty * pricePerLiter).toFixed(0);

            // GLOBAL Ledger Stats (Bottom Bar)
            renderGlobalLedger();
        }

        function renderGlobalLedger() {
            // 1. Calculate TOTAL Cost of all milk ever taken
            let allTimeQty = 0;
            Object.values(events).forEach(evt => {
                if(evt.qty) allTimeQty += parseFloat(evt.qty);
            });
            const allTimeCost = allTimeQty * pricePerLiter;

            // 2. Calculate TOTAL Payments made
            let allTimePaid = 0;
            payments.forEach(p => {
                allTimePaid += parseFloat(p.amount);
            });

            // 3. Outstanding Balance
            const balance = allTimeCost - allTimePaid;
            
            globalBalanceAmtEl.innerText = Math.abs(balance).toFixed(0);
            
            // Color Logic
            globalBalanceAmtEl.classList.remove('negative', 'positive');
            if(balance > 0) {
                globalBalanceAmtEl.classList.add('negative'); // You owe money
                globalBalanceAmtEl.innerText = "- " + Math.abs(balance).toFixed(0);
            } else if (balance < 0) {
                globalBalanceAmtEl.classList.add('positive'); // You overpaid
                globalBalanceAmtEl.innerText = "+ " + Math.abs(balance).toFixed(0);
            } else {
                globalBalanceAmtEl.innerText = "0"; // Settled
            }

            // 4. Render Payment History (Reverse Chronological)
            paymentHistoryList.innerHTML = '';
            // Clone array and sort to avoid mutating original
            const sortedPayments = [...payments].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (sortedPayments.length === 0) {
                paymentHistoryList.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; text-align:center; padding:10px;">No payment history</div>';
            }

            // Show all (scrollable)
            sortedPayments.forEach(p => {
                const item = document.createElement('div');
                item.className = 'payment-item';
                item.innerHTML = `
                    <div>
                        <div class="payment-amt">${parseFloat(p.amount).toFixed(0)}</div>
                        <div class="payment-date">${p.date}</div>
                    </div>
                    <button class="payment-delete" onclick="deletePayment(${p.id})">&times;</button>
                `;
                paymentHistoryList.appendChild(item);
            });
        }

        function openEntryModal(date) {
            clicked = date;
            const event = events[date];
            document.getElementById('selectedDateText').innerText = date;
            if (event) {
                qtySlider.value = event.qty;
                milkNote.value = event.note || '';
                milkToggle.checked = event.qty > 0;
            } else {
                qtySlider.value = 0;
                milkNote.value = '';
                milkToggle.checked = false;
            }
            updateCostPreview();
            entryModal.classList.add('open');
        }

        function closeModal() {
            entryModal.classList.remove('open');
            paymentModal.classList.remove('open');
            settingsModal.classList.remove('open');
            clicked = null;
        }

        function saveEntry() {
            if (clicked) {
                const qty = parseFloat(qtySlider.value);
                const note = milkNote.value;
                if (qty === 0 && note === '') delete events[clicked];
                else events[clicked] = { qty, note };
                
                localStorage.setItem('milkEvents', JSON.stringify(events));
                closeModal();
                load();
            }
        }

        function savePayment() {
            const amt = parseFloat(payAmountInput.value);
            const date = payDateInput.value;

            if (!amt || !date) {
                alert("Please enter amount and date");
                return;
            }

            const newPayment = {
                id: Date.now(),
                amount: amt,
                date: date
            };

            payments.push(newPayment);
            localStorage.setItem('milkPaymentLog', JSON.stringify(payments));
            
            closeModal();
            load();
        }

        window.deletePayment = function(id) {
            if(confirm("Delete this payment record?")) {
                payments = payments.filter(p => p.id !== id);
                localStorage.setItem('milkPaymentLog', JSON.stringify(payments));
                load();
            }
        };

        init();
    </script>
</body>
</html>
